config:
  seed: 42
  device: null
  data_directory: "data"
  model_directory: "models"
  representation_model_name: "simclr_cifar10.pth"

# Augmentation
augmentation:
  size: 32
  scale: [0.2, 1.0]
  p_random_horizontal_flip: 0.5
  brightness: 0.4
  contrast: 0.4
  saturation: 0.4
  hue: 0.1
  p_color_jitter: 0.8
  p_grayscale: 0.2
  mean: [0.4914, 0.4822, 0.4465]
  std: [0.2023, 0.1994, 0.2010]

# Training
training:
  epochs: 500
  batch_size: 512
  lr: 0.4
  momentum: 0.9
  weight_decay: 0.0001

# Classifer evaluation
evaluation:
  epochs: 100
  batch_size: 64
  lr: 0.025
  momentum: 0.9
  weight_decay: 5.0e-4
  nesterov: true

# Clustering
cluster:
  max_clusters: 500
  B: 10
  min_cluster_size: 5
